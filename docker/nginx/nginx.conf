# Docker copies this file as a template: the HTTPS port below comes from the
# APP_HTTPS_PORT environment variable, Nginx variables stay unchanged.
server {
    listen 80;
    server_name _;

    # Passwords and session cookies are sent only over HTTPS.
    return 301 https://$host:${APP_HTTPS_PORT}$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 11m;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /app/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
